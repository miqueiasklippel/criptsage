name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Núcleo criptográfico
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Executar os testes
        run: node tests/criptsage.test.mjs

      - name: Conferir a sintaxe do service worker
        run: node --check sw.js

      - name: Validar o manifesto
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifesto válido')"
